[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eth-lang"
version = "0.1.0"
description = "An Amharic-first programming language interpreter"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Eth contributors"}]

[project.scripts]
eth = "eth:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
